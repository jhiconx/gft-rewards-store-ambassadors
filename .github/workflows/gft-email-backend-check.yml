name: GFT Rewards Application Email Smoke Test
on:
  push:
    paths:
      - .github/workflows/gft-email-backend-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify GFT Supabase and Iconx Resend backend
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://yxfqfrgjjbxagrioeqzz.supabase.co/functions/v1/gft-store-ambassador-apply?health=1'
          with urllib.request.urlopen(url,timeout=20) as response:
              result=json.load(response)
          print('Readiness:',{k:result.get(k) for k in ['ok','ready','databaseConfigured','resendKeyConfigured','iconxRelayReady']})
          if not result.get('ready'): raise SystemExit('GFT recruitment email backend is not ready')
          PY
      - name: Submit one synthetic application and verify email acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, uuid
          url='https://yxfqfrgjjbxagrioeqzz.supabase.co/functions/v1/gft-store-ambassador-apply'
          payload={
              'submission_id':str(uuid.uuid4()),
              'full_name':'GFT System Test Ignore',
              'email':'gft-smoketest@example.com',
              'mobile':'2025550123',
              'state':'FL',
              'territory':'FL-01',
              'base_city':'Miami (automated QA test)',
              'retail_experience':'AUTOMATED QA TEST - not a real ambassador application',
              'website':'',
              'language':'en',
              'bilingual':True,
              'consent':True
          }
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  status=response.status
                  result=json.load(response)
          except urllib.error.HTTPError as error:
              status=error.code
              result=json.load(error)
          print('Application test:',{'status':status,'ok':result.get('ok'),'received':result.get('received'),'emailed':result.get('emailed'),'error':result.get('error')})
          if status!=200 or not result.get('ok') or not result.get('received') or not result.get('emailed'):
              raise SystemExit('GFT application storage or Resend email acceptance failed')
          PY
