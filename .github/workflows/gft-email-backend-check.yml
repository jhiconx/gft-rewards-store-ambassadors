name: GFT Rewards Email Backend Readiness
on:
  push:
    paths:
      - .github/workflows/gft-email-backend-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify existing Iconx Resend service
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          urls = {
            'Supabase': 'https://yxfqfrgjjbxagrioeqzz.supabase.co/functions/v1/gft-store-ambassador-apply?health=1',
            'Iconx Vercel': 'https://iconx-io.vercel.app/api/gft-ambassador-mail?health=1'
          }
          ready = []
          for label, url in urls.items():
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  print(label, 'backend:', {k:payload.get(k) for k in ('ok','ready','databaseConfigured','resendKeyConfigured','senderEnvConfigured') if k in payload})
                  if payload.get('ready') is True:
                      ready.append(label)
              except Exception as error:
                  print(label, 'health check unavailable:', type(error).__name__)
          if not ready:
              raise SystemExit('No working server-side Resend configuration was detected')
          print('Configured email service:', ', '.join(ready))
          PY
