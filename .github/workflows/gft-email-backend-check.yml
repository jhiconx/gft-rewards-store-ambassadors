name: GFT Rewards Email Backend Readiness
on:
  push:
    paths:
      - .github/workflows/gft-email-backend-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify server-side Resend configuration is present
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = 'https://yxfqfrgjjbxagrioeqzz.supabase.co/functions/v1/gft-store-ambassador-apply?health=1'
          with urllib.request.urlopen(url, timeout=20) as response:
              payload = json.load(response)
          print('Server configuration:', {key: payload.get(key) for key in ('databaseConfigured','resendKeyConfigured','senderEnvConfigured')})
          if payload.get('ok') is not True or payload.get('ready') is not True:
              raise SystemExit('GFT application backend is deployed but Resend configuration is not ready')
          print('GFT application backend and email configuration are present')
          PY
