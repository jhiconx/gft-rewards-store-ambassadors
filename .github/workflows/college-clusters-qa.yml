name: GFT College Cluster Page QA
on:
  push:
    paths:
      - 'college-clusters*'
      - 'index.html'
      - 'i18n.js'
      - 'tests/college-clusters-smoke.cjs'
      - '.github/workflows/college-clusters-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-college-clusters:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned DOM test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@25.0.1
      - name: JavaScript syntax checks
        run: |
          node --check college-clusters-data.js
          node --check college-clusters.js
          node --check i18n.js
          node --check app.js
      - name: DOM and bilingual interaction smoke test
        run: node tests/college-clusters-smoke.cjs
